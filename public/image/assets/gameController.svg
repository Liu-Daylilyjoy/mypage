<svg width="245" height="200" viewBox="0 0 245 200" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .button-yellow {
      animation: press-yellow 4s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-cyan {
      animation: press-cyan 0.28s 0.07s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-green {
      animation: press-green 0.5s 0.5s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-red {
      animation: press-red 1s 1s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-arrow-up {
      animation: press-arrow-up 1s 0.3s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-arrow-right {
      animation: press-arrow-right 1s 0.5s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-arrow-down {
      animation: press-arrow-down 1s 1s infinite cubic-bezier(.4,0,.6,1);
    }
    .button-arrow-left {
      animation: press-arrow-left 1s 0s infinite cubic-bezier(.4,0,.6,1);
    }
    @keyframes press-yellow {
      0%, 100% { fill: #DBF352; }
      50% { fill: #B5C900; }
    }
    @keyframes press-cyan {
      0%, 100% { fill: #52EBF3; }
      50% { fill: #1CA6B8; }
    }
    @keyframes press-green {
      0%, 100% { fill: #7DF352; }
      50% { fill: #3EA600; }
    }
    @keyframes press-red {
      0%, 100% { fill: #F35262; }
      50% { fill: #B8001C; }
    }
    @keyframes press-arrow-up {
      0%, 100% { fill: #A58888; }
      50% { fill: #8F7272; }
    }
    @keyframes press-arrow-right {
      0%, 100% { fill: #A58888; }
      50% { fill: #8F7272; }
    }
    @keyframes press-arrow-down {
      0%, 100% { fill: #A58888; }
      50% { fill: #8F7272; }
    }
    @keyframes press-arrow-left {
      0%, 100% { fill: #A58888; }
      50% { fill: #8F7272; }
    }
  </style>
</defs>
